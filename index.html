<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WaterBit - Proteção contra Alagamentos</title>
  
  <!-- Configurações PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1826">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="f540bfa883d66bd1aa2afc572920097e95b5cfe9.jpg">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind Configuration para Modo Escuro Customizado -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            waterbit: {
              blue: '#3b82f6',
              darkbg: '#0d1826',
              darkcard: 'rgba(21, 34, 50, 0.78)',
              darkcardborder: 'rgba(51, 65, 85, 0.6)',
              darknav: '#111d2e',
            }
          }
        }
      }
    }
  </script>
  
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- SDKs do Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <!-- Arquivo CSS Externo -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-800 dark:text-slate-100 antialiased">

  <!-- BACKGROUND COMPONENT -->
  <div id="bgLayer" class="fixed inset-0 pointer-events-none z-[-1] bg-app-theme transition-all duration-500"></div>

  <div class="app-container">
    
    <!-- ABA: INÍCIO (Home) -->
    <div id="view-home" class="view-content active pt-10">
      
      <!-- Header com LOGO WaterBit -->
      <div class="flex flex-col items-center mb-6">
        <div class="w-20 h-20 mb-2 relative drop-shadow-lg flex items-center justify-center">
          <img src="f540bfa883d66bd1aa2afc572920097e95b5cfe9.jpg" 
               alt="WaterBit Logo" 
               class="w-full h-full object-contain rounded-2xl"
               onerror="this.style.display='none'; document.getElementById('svgLogoFallback').style.display='block';">
          
          <svg id="svgLogoFallback" viewBox="0 0 200 200" class="w-full h-full hidden" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="logoDropGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#38bdf8"/>
                <stop offset="50%" stop-color="#3b82f6"/>
                <stop offset="100%" stop-color="#1d4ed8"/>
              </linearGradient>
              <linearGradient id="buildingGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#e0f2fe"/>
                <stop offset="100%" stop-color="#38bdf8"/>
              </linearGradient>
            </defs>
            <path d="M 100,15 C 100,15 165,85 165,125 C 165,160 135,185 100,185 C 65,185 35,160 35,125 C 35,85 100,15 100,15 Z" fill="url(#logoDropGrad)"/>
            <rect x="62" y="115" width="14" height="42" rx="2" fill="url(#buildingGrad)"/>
            <rect x="80" y="95" width="16" height="62" rx="2" fill="url(#buildingGrad)"/>
            <rect x="100" y="75" width="18" height="82" rx="2" fill="url(#buildingGrad)"/>
            <rect x="122" y="105" width="14" height="52" rx="2" fill="url(#buildingGrad)"/>
            <path d="M 42,130 C 50,165 80,172 110,160 C 135,150 150,128 160,125" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
            <circle cx="160" cy="125" r="7" fill="#ffffff"/>
          </svg>
        </div>

        <h1 class="text-3xl font-extrabold text-blue-900 dark:text-blue-100 tracking-tight flex items-center gap-0.5">
          Water<span class="text-blue-500 dark:text-blue-400">Bit</span>
        </h1>
        <p class="text-xs font-medium text-blue-800/70 dark:text-blue-200/70 mt-0.5">
          Tecnologia que protege nossa cidade
        </p>
      </div>

      <!-- Barra de Pesquisa -->
      <div class="glass-card rounded-2xl p-3 mb-5 shadow-sm flex items-center gap-3">
        <i class="ph ph-magnifying-glass text-gray-400 dark:text-gray-400 text-xl ml-1"></i>
        <input type="text" placeholder="Pesquisar rua ou CEP" 
               class="w-full outline-none text-sm text-slate-800 dark:text-slate-100 bg-transparent placeholder-gray-400 dark:placeholder-gray-400">
      </div>

      <!-- Card Principal de Status Dinâmico (Firebase) -->
      <div id="homeStatusCard" class="status-normal rounded-3xl p-5 mb-5 shadow-sm transition-all duration-500">
        <div class="flex items-center gap-3 mb-2">
          <div id="homeStatusIconBg" class="w-9 h-9 rounded-full bg-white/50 dark:bg-black/20 flex items-center justify-center shrink-0">
            <i id="homeStatusIcon" class="ph-fill ph-check-circle text-2xl"></i>
          </div>
          <h2 id="homeStatusTitle" class="text-lg font-bold">Situação normal</h2>
        </div>
        <p id="homeStatusDesc" class="text-xs opacity-90 leading-relaxed font-normal">
          Não há riscos de alagamento próximos à sua região.
        </p>
        
        <!-- Métricas Rápidas IoT -->
        <div class="mt-4 pt-3 border-t border-black/10 dark:border-white/10 grid grid-cols-2 gap-2 text-xs">
          <div>
            <span class="opacity-75 block text-[10px] uppercase font-semibold">Ocupação Bueiro #01</span>
            <span id="homeWaterLevel" class="font-bold text-base">--%</span>
          </div>
          <div>
            <span class="opacity-75 block text-[10px] uppercase font-semibold">Distância da Água</span>
            <span id="homeWaterDist" class="font-bold text-base">-- cm</span>
          </div>
        </div>
      </div>

      <!-- Card do Mapa Interativo -->
      <div class="glass-card rounded-3xl p-4 flex items-center justify-between cursor-pointer shadow-sm relative overflow-hidden group" 
           onclick="switchTab('map')">
        <div class="relative z-10 pr-2">
          <div class="flex items-center gap-2 font-bold text-blue-900 dark:text-blue-100 mb-1 text-sm">
            <i class="ph ph-map-trifold text-blue-500 text-lg"></i>
            Mapa da região
          </div>
          <p class="text-xs text-slate-600 dark:text-slate-300 leading-snug">
            Confira os pontos monitorados e áreas de risco.
          </p>
        </div>
        <div class="w-10 h-10 rounded-full bg-blue-500/10 dark:bg-blue-400/20 flex items-center justify-center z-10 shrink-0 group-hover:scale-105 transition-transform">
          <i class="ph ph-arrow-right text-blue-500 dark:text-blue-400 text-lg"></i>
        </div>
        <div class="absolute right-0 top-0 w-36 h-full opacity-20 dark:opacity-30 mock-map"></div>
      </div>
    </div>

    <!-- ABA: MAPA -->
    <div id="view-map" class="view-content pt-10">
      <h2 class="text-2xl font-bold text-slate-800 dark:text-slate-100 mb-4 pl-1">Mapa</h2>
      
      <div class="glass-card rounded-2xl p-3 mb-4 shadow-sm flex items-center gap-3">
        <i class="ph ph-magnifying-glass text-gray-400 text-xl ml-1"></i>
        <input type="text" placeholder="Pesquisar rua, CEP ou bairro" 
               class="w-full outline-none text-sm text-slate-800 dark:text-slate-100 bg-transparent placeholder-gray-400">
      </div>

      <div class="flex gap-2 mb-5 overflow-x-auto pb-2 scrollbar-hide">
        <button class="px-4 py-1.5 rounded-full bg-blue-500 text-white text-xs font-semibold shrink-0 shadow-md">Todos</button>
        <button class="px-4 py-1.5 rounded-full glass-card text-xs font-medium shrink-0 flex items-center gap-1.5 border border-white/40">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Normais
        </button>
        <button class="px-4 py-1.5 rounded-full glass-card text-xs font-medium shrink-0 flex items-center gap-1.5 border border-white/40">
          <span class="w-2 h-2 rounded-full bg-amber-500"></span> Atenção
        </button>
        <button class="px-4 py
